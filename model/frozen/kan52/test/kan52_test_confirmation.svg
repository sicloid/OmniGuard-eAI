<text x="654" y="342" font-size="11" fill="#475569">bootstrap, one capture</text>
<text x="96" y="574" font-size="10.5" fill="#64748b">Benign: CTU-Honeypot-Capture-7-1, 13.5694 observed device-hours. Infected: CTU-IoT-Malware-Capture-3-1, 35.6319 observed device-hours. The two are never pooled.</text>
<text x="96" y="588" font-size="10.5" fill="#64748b">Zero observed false quarantines is not zero risk: one device over a few hours cannot show a rate this data has no power to measure.</text>
<text x="96" y="602" font-size="10.5" fill="#64748b">Leakage here is policy intent. Bytes delivered before the kernel ACK are KAN-33 and the G8 run, reported separately.</text>
<text x="96" y="616" font-size="10.5" fill="#64748b">Dotted bars (6 of 16 cells): the resampled blocks did not straddle the measurement, so that width is not an uncertainty to quote.</text>
