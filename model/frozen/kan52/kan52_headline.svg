<text x="96" y="574" font-size="10.5" fill="#64748b">Benign: CTU-Honeypot-Capture-5-1, 1.4153 observed device-hours. Infected: CTU-IoT-Malware-Capture-8-1, 13.5028 observed device-hours. The two are never pooled.</text>
<text x="96" y="588" font-size="10.5" fill="#64748b">Zero observed false quarantines is not zero risk: one device over a few hours cannot show a rate this data has no power to measure.</text>
<text x="96" y="602" font-size="10.5" fill="#64748b">Leakage here is policy intent. Bytes delivered before the kernel ACK are KAN-33 and the G8 run, reported separately.</text>
<text x="96" y="616" font-size="10.5" fill="#64748b">Dotted bars (5 of 16 cells): the resampled blocks did not straddle the measurement, so that width is not an uncertainty to quote.</text>
