name: KAN-31 formatter debug
on:
  pull_request:
    paths:
      - gateway/enforcer.py
      - tests/test_enforcer.py
      - .github/workflows/kan31-format-debug.yml

permissions:
  contents: read

jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - run: python -m pip install --require-hashes -r requirements-ml.lock
      - name: Show exact Ruff formatter diff
        run: |
          ruff format gateway/enforcer.py tests/test_enforcer.py
          git diff -- gateway/enforcer.py tests/test_enforcer.py
