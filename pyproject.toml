[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "omniguard-eai"
version = "0.1.0.dev0"
description = "Self-hosted IoT detection and reversible egress containment research prototype"
requires-python = ">=3.14.7,<3.15"
dependencies = ["dpkt==1.9.8"]

[project.optional-dependencies]
dev = ["ruff==0.15.6"]
ml = ["scikit-learn==1.8.0", "numpy==2.5.3", "scipy==1.18.1", "joblib==1.6.0"]

[tool.setuptools.packages.find]
include = ["core*", "stubs*", "sources*", "gateway*", "lab*", "model*", "telemetry*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
