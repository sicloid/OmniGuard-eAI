[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "omniguard-eai"
version = "0.1.0.dev0"
description = "Self-hosted IoT detection and reversible egress containment research prototype"
requires-python = "==3.14.*"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.15.6"]

[tool.setuptools.packages.find]
include = ["core*", "stubs*", "model*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
